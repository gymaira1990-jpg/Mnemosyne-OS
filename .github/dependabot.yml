# 依赖安全与陈旧度自动巡检（不自动合并，只开 PR 让人审）
version: 2
updates:
  # Python 依赖
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]
    groups:
      # 小版本升级合一个 PR，避免噪音
      minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]

  # GitHub Actions 版本
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(ci)"
    labels: ["dependencies", "ci"]
