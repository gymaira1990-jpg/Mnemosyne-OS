name: test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  lint:
    # 只拦「会出错」的规则（E9/F63/F7/F82），组见 pyproject.toml [tool.ruff.lint]
    # 2026-10-26 上线首日即抓到一个真 bug：新加的 log.warning 引用了不存在的变量（F821 NameError 隐患）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff (blocking rules only)
        run: ruff check .

  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    # 2026-11-07：以前 CI 没库 ⇒ 17 个 DB 用例静默 skip，绿的是「没跑」。
    # 现在起真库：pgvector 镜像 + 建两个测试库 + 导 docs/schema.sql。
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      MNEMOSYNE_V8TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/mnemosyne_v8test
      MNEMOSYNE_ITEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/mnemosyne_itest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # mcp / httpx 只给 MCP 桥的契约测试用；不装的话那几个用例会 skip，
          # 而契约错误（发错字段名）本身是「零报错静默失效」，skip 等于放行。
          pip install pytest pytest-asyncio mcp httpx
      - name: Create test databases + schema
        run: |
          for db in mnemosyne_v8test mnemosyne_itest; do
            psql -h 127.0.0.1 -U postgres -d postgres -c "CREATE DATABASE $db;"
            psql -h 127.0.0.1 -U postgres -d "$db" -v ON_ERROR_STOP=1 -q -f docs/schema.sql
          done
      - name: Verify DB fixtures are real (not skipped)
        run: |
          psql -h 127.0.0.1 -U postgres -d mnemosyne_v8test -tAc \
            "select count(*) from information_schema.tables where table_name='gc_log'"
      - name: Run tests
        run: python -m pytest tests/ -v
